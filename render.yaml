# Render blueprint: the web app as a Docker service. The graph lives in FalkorDB Cloud (D-033).
# In Render: New > Blueprint > pick this repo, then fill in the values marked sync: false.
services:
  - type: web
    name: blast-radius
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"
      - key: ANTHROPIC_API_KEY   # optional: without it the app runs the fixed pipeline
        sync: false
      - key: AGENT_RUNS_PER_DAY
        value: "300"
      - key: AGENT_RUNS_PER_HOUR_PER_IP
        value: "15"
      - key: MAX_LIVE_SESSIONS
        value: "3"   # each live session holds a ~90 MB tool process; fits the free 512 MB plan
