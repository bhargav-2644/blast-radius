[project]
name = "blast-radius"
version = "0.1.0"
description = "Agent that traces a CVE through dependency graphs to services, customers and past decisions, on FalkorDB."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8",
    "anthropic[mcp]>=1.14",
    "mcp>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "semver>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blast_radius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
